- name: Congiure User Service
  hosts: user
  become: yes
  tasks:
  - name: enable nodejs 20
    ansible.builtin.command: dnf enable module nodejs:20 -y

  - name: install nodejs
    ansible.builtin.dnf:
     name: nodejs
     state: present

  - name: create system user roboshop
    ansible.builtin.user:
     name: roboshop
     system: yes
     home: /app
     shell: /sbin/nologin
     comment: "Roboshop Application User"

  - name: create application direactoy
    ansible.builtin.file:
    path: /app
    state: absent

  - name: create application direactoy
    ansible.builtin.file:         
    path: /app
    state: directory

  - name: delete user zip file
    ansible.builtin.file: 
    path: /tmp/user.zip
    state: absent

  - name: download user zip file
    ansible.builtin.get_url:
    url: "https://roboshop-artifacts.s3.amazonaws.com/user.zip"
    dest: /tmp/user.zip

  - name: unzip user zip file
    ansible.builtin.unarchive:
    src: /tmp/user.zip
    dest: /app
    remote_src: yes 

  - name: install nodejs dependencies
    community.general.npm:
      path: /app

  - name: copy user files
    ansible.builtin.template:
      src: user.service
      dest: /etc/systemd/system/user.service                   

  - name: demon reload
    ansible.builtin.systemd:
      daemon_reload: true

  - name: start user service
    ansible.builtin.service:
      name: user
      state: restarted
      enabled: true 
             