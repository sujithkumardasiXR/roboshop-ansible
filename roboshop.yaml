- name: create ec2 and r53 records
  hosts: all
  connections: local
  vars:
    sg_id: "sg-0863830c1c1ca306a"
    ami_id: "ami-0055977a6e828a4f4"
    env: dev
    actions: create
    instances:
    - mongodb
    - catalogue
  tasks:
  - name: create ec2 isntance
    amazone.aws.ec2_instance:
      instance_type: "t3.micro"
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"   
      name: "{{ item }}-{{ env }}"
      tags:
        projects: roboshop
        component: "{{ item }}"
        Environment: "{{ env }}"
        name: "{{ item }}-{{ env }}"
  loop: "{{ instances }}"
  register: ec2_output
  when: actions == "create"

- name: print the output
  ansible.builtin.debug:
  msg: "{{ ec2_output }}" 
  when: actions == "create"

- name: create r53 records
  amazon.aws.route53:
    state: present
    zone: "{{domain_name}}"
    record: "{{ item.item }}-{{ env }}.{{ domain_name }}"
    type: A
    ttl: 1
    value: "{{ item.instances[0].private_ip_address }}"
    wait: false
    overwrite: true
  loop: "{{ ec2_output.results }}"
  when: actions == "create"  

- name: create r53 records for frontend
  amazon.aws.route53:
    state: present
    zone: "{{domain_name}}"
    record: "{{ item.item }}-{{ env }}.{{ domain_name }}"
    type: A
    ttl: 1  
    value: "{{ item.instances[0].public_ip_address }}"
    wait: false 
    overwrite: true
  loop: "{{ ec2_output.results }}"
  when:
  - item.item == "frontend" 
  - actions == "create"   


- name: delete r53 records for frontend
  amazon.aws.route53:
    state: absent
    zone: "{{domain_name}}"
    record: "{{ item.item }}-{{ env }}.{{ domain_name }}"
    type: A
    ttl: 1
    loop: "{{ instances }}"
  when: 
  - item == "frontend"
  - actions == "destroy"

- name: delete r53 records
  amazon.aws.route53:
    state: absent
    zone: "{{domain_name}}"
    record: "{{ item }}-{{ env }}.{{ domain_name }}"
    type: A 
    ttl: 1
  loop: "{{ instances }}"
  when: actions == "destroy"

- name: delete ec2 instance
  amazone.aws.ec2_instance:
    state: absent
    instance_ids: "{{ item}}-{{ env }}"
    waite: false
  loop: "{{ instances }}"
  when: actions == "destroy"    